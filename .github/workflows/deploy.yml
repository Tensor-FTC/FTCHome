name: Deploy

# Installing the app needs an HTTPS origin — service workers refuse to register
# anywhere else. GitHub Pages gives that for free, so this is the shortest path
# from "clone" to "an icon on my phone".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      - name: Build
        # Pages serves from /<repo>/, so the bundle, the service worker scope and
        # the manifest all have to agree on that prefix.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Optional. Set these as repository secrets and every device gets
          # accounts and sync without anybody pasting keys into Settings.
          # The anon key is designed to ship to browsers; the service_role key
          # never goes here, or anywhere else the build can see.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Single-page-app fallback
        # Pages has no rewrite rules; a copy of index.html as 404.html makes a
        # deep link like /live resolve instead of 404ing.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
